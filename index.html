<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43">
<title>Subha Business Manager</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#172b4d;--muted:#65758b;--line:#e3eaf2;--blue:#1769aa;--blue2:#e8f2fc;--red:#c0392b;--green:#16845b;--shadow:0 5px 22px #19334d0c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.shell{max-width:1160px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#1769aa,#123b63);color:white;display:grid;place-items:center;font-size:23px;font-weight:800}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.pill{font-size:12px;color:var(--green);background:#e7f6ef;padding:7px 11px;border-radius:20px}.nav{display:flex;gap:7px;overflow:auto;padding:4px 0 13px;margin-bottom:8px}.nav button{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:10px 15px;border-radius:10px;white-space:nowrap;font-weight:600;cursor:pointer}.nav button.active{background:var(--blue);color:white;border-color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow);margin-bottom:14px}.metric small{color:var(--muted);display:block}.metric strong{font-size:26px;display:block;margin-top:7px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 12px}.section-head h2{font-size:18px;margin:0}.muted{color:var(--muted)}.btn{border:0;background:var(--blue);color:white;padding:10px 14px;border-radius:9px;font-weight:650;cursor:pointer}.btn.light{background:var(--blue2);color:var(--blue)}.btn.danger{background:#fff0ef;color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:650;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit}.field textarea{min-height:70px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);font-size:13px}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}td .sub{display:block;color:var(--muted);font-size:11px}.empty{text-align:center;color:var(--muted);padding:25px}.alert{background:#fff7e6;border:1px solid #f4dfae;color:#815b13;padding:12px;border-radius:10px;font-size:13px}.success{color:var(--green)}.hidden{display:none!important}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.quick button{padding:15px 8px}.foot{color:var(--muted);font-size:11px;text-align:center;padding:20px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172b4d;color:white;padding:11px 17px;border-radius:10px;box-shadow:var(--shadow);z-index:5;display:none;max-width:90%;text-align:center}.filter{max-width:220px}.reportgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tag{background:var(--blue2);color:var(--blue);border-radius:20px;padding:4px 8px;font-size:11px}
@media(max-width:760px){.shell{padding:14px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.metric strong{font-size:22px}.quick{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start}.pill{display:none}.reportgrid{grid-template-columns:1fr 1fr}}
</style></head>
<body><div class="shell">
<header class="top"><div class="brand"><div class="logo">S</div><div><h1>Subha Business Manager</h1><p>Subha Sound &amp; Electronics · Shop dashboard</p></div></div><span class="pill">● Data saved on this device</span></header>
<nav class="nav" id="nav"><button class="active" data-page="dashboard">Dashboard</button><button data-page="products">Products &amp; Stock</button><button data-page="sales">Sales</button><button data-page="expenses">Expenses</button><button data-page="customers">Customers</button><button data-page="reports">Reports</button><button data-page="settings">Backup &amp; Settings</button></nav>
<main id="app"></main><footer class="foot">Subha Sound &amp; Electronics · Private shop records · Back up your data regularly</footer></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const KEY='subha_business_manager_v1';const today=()=>new Date().toLocaleDateString('en-CA');const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=load();let page='dashboard';function fresh(){return {products:[],sales:[],expenses:[],customers:[],shop:{name:'Subha Sound & Electronics',phone:'7908488988'}}}function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&['products','sales','expenses','customers'].every(k=>Array.isArray(d[k])))return {...fresh(),...d}}catch(e){}return fresh()}function save(){localStorage.setItem(KEY,JSON.stringify(db));updateStatus()}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2400)}function updateStatus(){let p=document.querySelector('.pill');if(p)p.textContent='● Saved on this device'}function sum(a){return a.reduce((n,x)=>n+Number(x.amount||0),0)}function rows(items,cols){return items.length?items.map(x=>'<tr>'+cols.map(c=>'<td>'+c(x)+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="8" class="empty">No records yet</td></tr>'}function field(label,id,type='text',required=true,value=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="0.01"':''}></div>`}function select(label,id,opts){return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${opts.map(o=>`<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}</select></div>`}function table(head,body){return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`}function setPage(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});
function render(){let el=document.getElementById('app');if(page==='dashboard'){let s=db.sales.filter(x=>x.date===today()),ex=db.expenses.filter(x=>x.date===today()),low=db.products.filter(x=>Number(x.qty)<=5);el.innerHTML=`<div class="grid"><div class="card metric"><small>Today's sales</small><strong>${money(sum(s))}</strong></div><div class="card metric"><small>Today's expenses</small><strong>${money(sum(ex))}</strong></div><div class="card metric"><small>Today's net*</small><strong>${money(sum(s)-sum(ex))}</strong></div><div class="card metric"><small>Units in stock</small><strong>${db.products.reduce((n,p)=>n+Number(p.qty),0)}</strong></div></div><div class="section-head"><h2>Quick actions</h2><span class="muted">${new Date().toLocaleDateString('en-IN',{dateStyle:'medium'})}</span></div><div class="card quick"><button class="btn" data-go="sales">＋ Record sale</button><button class="btn light" data-go="products">＋ Add product</button><button class="btn light" data-go="expenses">＋ Add expense</button><button class="btn light" data-go="customers">＋ Add customer</button></div><div class="section-head"><h2>Low stock</h2><button class="btn light small" data-go="products">Manage stock</button></div><div class="card">${low.length?table(['Product','Category','Available'],rows(low,[p=>esc(p.name),p=>esc(p.category||'—'),p=>`<span class="${p.qty<=2?'success':''}">${p.qty}</span>`])):'<div class="empty">No low-stock products. Alerts appear at 5 units or fewer.</div>'}</div><div class="section-head"><h2>Recent sales</h2><button class="btn light small" data-go="sales">View all</button></div><div class="card">${table(['Date','Item','Customer','Amount'],rows(db.sales.slice(-5).reverse(),[s=>esc(s.date),s=>esc(s.item),s=>esc(s.customer||'Walk-in'),s=>money(s.amount)]))}</div><p class="muted" style="font-size:11px">*Net is recorded sales minus recorded expenses. It is not accounting profit unless product costs and all expenses are recorded.</p>`;
}else if(page==='products'){el.innerHTML=`<div class="section-head"><h2>Products &amp; inventory</h2><span class="tag">${db.products.length} products</span></div><div class="card"><h3>Add a product</h3><form id="productForm" class="formgrid">${field('Product name','pn')}${field('Category','pc')}${field('Selling price (₹)','pp','number')}${field('Purchase cost per unit (₹)','pcost','number',false)}${field('Opening stock quantity','pq','number')}<div class="full actions"><button class="btn">Save product</button></div></form></div><div class="card"><h3>Product list</h3>${table(['Product','Category','Sell price','Cost','Stock','Action'],rows(db.products,[x=>esc(x.name),x=>esc(x.category||'—'),x=>money(x.price),x=>money(x.cost),x=>x.qty,x=>`<button class="btn light small" data-edit-product="${x.id}">Edit</button> <button class="btn danger small" data-del="products" data-id="${x.id}">Delete</button>`]))}</div>`;
}else if(page==='sales'){el.innerHTML=`<div class="section-head"><h2>Sales &amp; billing records</h2></div><div class="card"><h3>Record a sale</h3><form id="saleForm" class="formgrid">${select('Product / service','si',[{value:'',label:'Select product or service'},...db.products.map(p=>({value:p.id,label:p.name+' · stock '+p.qty})),{value:'service',label:'Other service / walk-in item'}])}${field('Item / service name','sother', 'text',false)}${field('Quantity','sq','number')}${field('Total amount received (₹)','sa','number')}${field('Customer name','sc','text',false)}${field('Date','sd','date',true,today())}<div class="full actions"><button class="btn">Save sale</button></div></form><p class="muted" style="font-size:11px">Stock is reduced automatically when a saved sale is linked to a product.</p></div><div class="card"><h3>Sales history</h3>${table(['Date','Item','Qty','Customer','Amount','Action'],rows(db.sales.slice().reverse(),[s=>esc(s.date),s=>esc(s.item),s=>s.qty,s=>esc(s.customer||'Walk-in'),s=>money(s.amount),s=>`<button class="btn danger small" data-del="sales" data-id="${s.id}">Delete</button>`]))}</div>`;
}else if(page==='expenses'){el.innerHTML=`<div class="section-head"><h2>Shop expenses</h2></div><div class="card"><form id="expenseForm" class="formgrid">${field('Expense description','en')}${select('Expense category','ec',['Rent','Electricity','Transport','Staff','Internet / Phone','Purchase / Stock','Repair','Other'].map(x=>({value:x,label:x})))}${field('Amount (₹)','ea','number')}${field('Date','ed','date',true,today())}<div class="full actions"><button class="btn">Save expense</button></div></form></div><div class="card"><h3>Expense history</h3>${table(['Date','Description','Category','Amount','Action'],rows(db.expenses.slice().reverse(),[x=>esc(x.date),x=>esc(x.name),x=>esc(x.category),x=>money(x.amount),x=>`<button class="btn danger small" data-del="expenses" data-id="${x.id}">Delete</button>`]))}</div>`;
}else if(page==='customers'){el.innerHTML=`<div class="section-head"><h2>Customer directory</h2></div><div class="card"><form id="customerForm" class="formgrid">${field('Customer name','cn')}${field('Mobile number','cm','tel')}${field('Address','ca','text',false)}<div class="full actions"><button class="btn">Add customer</button></div></form></div><div class="card"><h3>Customers</h3>${table(['Name','Mobile','Address','Action'],rows(db.customers,[x=>esc(x.name),x=>esc(x.phone),x=>esc(x.address||'—'),x=>`<button class="btn danger small" data-del="customers" data-id="${x.id}">Delete</button>`]))}</div>`;
}else if(page==='reports'){let totalS=sum(db.sales),totalE=sum(db.expenses),cost=db.sales.reduce((n,s)=>n+Number(s.costTotal||0),0);let months=Array.from({length:6},(_,i)=>{let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);let k=d.toLocaleDateString('en-CA').slice(0,7);return {k,s:sum(db.sales.filter(x=>x.date.startsWith(k))),e:sum(db.expenses.filter(x=>x.date.startsWith(k)))}});el.innerHTML=`<div class="section-head"><h2>Business reports</h2></div><div class="reportgrid"><div class="card metric"><small>Total sales</small><strong>${money(totalS)}</strong></div><div class="card metric"><small>Total expenses</small><strong>${money(totalE)}</strong></div><div class="card metric"><small>Estimated gross profit</small><strong>${money(totalS-cost-totalE)}</strong></div></div><div class="card"><h3>Monthly summary · last 6 months</h3>${table(['Month','Sales','Expenses'],rows(months,[x=>x.k,x=>money(x.s),x=>money(x.e)]))}</div><div class="alert">Profit estimate uses the purchase cost saved on each product sale plus recorded expenses. For services or products without a purchase cost, the estimate may be incomplete.</div>`;
}else if(page==='settings'){el.innerHTML=`<div class="section-head"><h2>Backup &amp; settings</h2></div><div class="card"><h3>Shop details</h3><form id="shopForm" class="formgrid">${field('Shop name','shopname','text',true,db.shop.name)}${field('Contact number','shopphone','tel',false,db.shop.phone)}<div class="full actions"><button class="btn">Save shop details</button></div></form></div><div class="card"><h3>Backup your records</h3><p class="muted">Download a complete JSON backup regularly. Import it on this browser to restore your records.</p><div class="actions"><button class="btn" id="export">↓ Download backup</button><label class="btn light" for="importFile">↑ Restore backup</label><input id="importFile" type="file" accept="application/json,.json" hidden></div></div><div class="alert">Your data is stored in this browser on this device. Clearing browser data, changing browsers or using another phone will not transfer records automatically. Keep backups safe. This version does not use cloud sync or user login.</div>`;}
}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
document.getElementById('app').addEventListener('click',e=>{let go=e.target.closest('[data-go]');if(go)return setPage(go.dataset.go);let del=e.target.closest('[data-del]');if(del){if(!confirm('Delete this record?'))return;let k=del.dataset.del;let item=db[k].find(x=>x.id===del.dataset.id);if(k==='sales'&&item?.productId){let p=db.products.find(x=>x.id===item.productId);if(p)p.qty+=Number(item.qty||0)}db[k]=db[k].filter(x=>x.id!==del.dataset.id);save();render();toast('Record deleted.')}let edit=e.target.closest('[data-edit-product]');if(edit){let p=db.products.find(x=>x.id===edit.dataset.editProduct);if(!p)return;let name=prompt('Product name',p.name);if(name===null)return;let price=prompt('Selling price',p.price);let qty=prompt('Stock quantity',p.qty);if(name.trim()&&Number(price)>=0&&Number(qty)>=0){Object.assign(p,{name:name.trim(),price:Number(price),qty:Number(qty)});save();render();toast('Product updated.')}}});
document.getElementById('app').addEventListener('submit',e=>{e.preventDefault();let f=e.target,v=id=>f.querySelector('#'+id)?.value.trim()||'';if(f.id==='productForm'){let p={id:id(),name:v('pn'),category:v('pc'),price:Number(v('pp')),cost:Number(v('pcost')||0),qty:Number(v('pq'))};if(!p.name||p.price<0||p.cost<0||p.qty<0)return toast('Check product details.');db.products.push(p)}if(f.id==='saleForm'){let pid=v('si'),p=db.products.find(x=>x.id===pid),qty=Number(v('sq')),amount=Number(v('sa')),item=p?.name||(v('sother')||'Other service');if(!pid||qty<=0||amount<0||!Number.isFinite(qty+amount))return toast('Enter valid sale details.');if(p&&p.qty<qty)return toast('Insufficient stock.');if(p)p.qty-=qty;db.sales.push({id:id(),productId:p?.id||null,item,qty,amount,costTotal:p?Number(p.cost||0)*qty:0,customer:v('sc'),date:v('sd')||today()})}if(f.id==='expenseForm'){let amount=Number(v('ea'));if(!v('en')||amount<=0)return toast('Enter valid expense details.');db.expenses.push({id:id(),name:v('en'),category:v('ec'),amount,date:v('ed')||today()})}if(f.id==='customerForm'){if(!v('cn')||!v('cm'))return toast('Enter customer name and mobile.');db.customers.push({id:id(),name:v('cn'),phone:v('cm'),address:v('ca')})}if(f.id==='shopForm'){db.shop.name=v('shopname');db.shop.phone=v('shopphone')}save();render();toast('Saved successfully.')});
document.getElementById('app').addEventListener('click',e=>{if(e.target.id==='export'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='subha-business-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup downloaded.')}});document.getElementById('app').addEventListener('change',async e=>{if(e.target.id==='importFile'){try{let d=JSON.parse(await e.target.files[0].text());if(!d||!['products','sales','expenses','customers'].every(k=>Array.isArray(d[k])))throw Error();if(!confirm('Replace current records with this backup?'))return;db={...fresh(),...d};save();render();toast('Backup restored.')}catch(err){toast('Could not read this backup file.')}e.target.value=''}});render();
})();
</script></body></html>
